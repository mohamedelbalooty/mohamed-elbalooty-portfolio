name: Deploy to Firebase Hosting & GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Build Static Export
        run: npm run build

      - name: Verify Static Export Output
        run: |
          test -d out
          test -f out/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          echo "Static export verified successfully."

      # Firebase Hosting Deployment (Enabled when FIREBASE_SERVICE_ACCOUNT secret is set)
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOHAMED_ELBALOOTY_PORTFOLIO != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOHAMED_ELBALOOTY_PORTFOLIO || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: mohamed-elbalooty-portfolio

      # GitHub Pages Deployment (Fallback option)
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy-github-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
